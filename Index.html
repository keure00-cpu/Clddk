<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>freeIA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0d1117; color: #fff; min-height: 100vh; }
.app { max-width: 420px; margin: 0 auto; padding: 1rem; }
.header { text-align: center; padding: 1.5rem 0; }
.header h1 { font-size: 28px; font-weight: 900; color: #4488ff; letter-spacing: 2px; }
.header h1 span { color: #88bbff; }
.header p { font-size: 13px; color: #7a8aa0; margin-top: 4px; }

.section { background: #161d2e; border: 0.5px solid #2a3a5e; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
.section-title { font-size: 13px; font-weight: 500; color: #7a8aa0; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

.photo-area { width: 100%; height: 180px; border: 1.5px dashed #2a3a5e; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: background 0.15s; position: relative; overflow: hidden; }
.photo-area:hover { background: #1a2540; }
.photo-area img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; position: absolute; top: 0; left: 0; }
.photo-placeholder { display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 1; }
.photo-placeholder i { font-size: 32px; color: #3a4a6a; }
.photo-placeholder span { font-size: 13px; color: #3a4a6a; }
.photo-btn-row { display: flex; gap: 8px; margin-top: 10px; }
.photo-btn-row button { flex: 1; font-size: 13px; padding: 7px 0; background: #1a2540; border: 0.5px solid #2a3a5e; color: #aac4ff; border-radius: 8px; cursor: pointer; }
.photo-btn-row button:hover { background: #223060; }
.photo-btn-row button.danger { color: #ff6b6b; border-color: #5e2a2a; }

.avatar-preview { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid #2a3a5e; }
.avatar-circle { width: 56px; height: 56px; border-radius: 50%; background: #1a3a8f; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; color: #4488ff; overflow: hidden; flex-shrink: 0; }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.avatar-info .name { font-size: 15px; font-weight: 500; color: #fff; }
.avatar-info .sub { font-size: 12px; color: #7a8aa0; margin-top: 2px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 8px; border-radius: 100px; background: #0d2e1a; color: #4ade80; margin-top: 6px; }

.record-btn { width: 100%; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 0.5px solid #2a3a5e; background: #1a2540; color: #aac4ff; transition: all 0.15s; }
.record-btn:hover { background: #223060; }
.record-btn.recording { background: #2e0d0d; border-color: #5e2a2a; color: #ff6b6b; }
.record-btn i { font-size: 18px; }

.pulse { animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.waveform { display: flex; align-items: center; justify-content: center; gap: 3px; height: 36px; margin: 10px 0; }
.bar { width: 4px; border-radius: 2px; background: #4488ff; opacity: 0.3; transition: height 0.1s; }

.transcript-box { background: #0d1117; border: 0.5px solid #2a3a5e; border-radius: 8px; padding: 12px; min-height: 80px; margin-top: 10px; font-size: 14px; line-height: 1.6; color: #fff; position: relative; }
.transcript-placeholder { color: #3a4a6a; font-size: 13px; font-style: italic; }
.transcript-cursor { display: inline-block; width: 2px; height: 14px; background: #4488ff; vertical-align: text-bottom; margin-left: 2px; animation: blink 0.8s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.copy-btn { position: absolute; top: 8px; right: 8px; background: none; border: none; cursor: pointer; color: #3a4a6a; font-size: 16px; padding: 4px; border-radius: 4px; }
.copy-btn:hover { color: #aac4ff; }

.status-bar { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #2a3a5e; }
.status-dot.active { background: #22c55e; }
.status-dot.recording { background: #ef4444; animation: pulse 1s infinite; }
.status-text { font-size: 12px; color: #7a8aa0; }
.timer { font-size: 12px; color: #3a4a6a; margin-left: auto; font-variant-numeric: tabular-nums; }
.hidden { display: none; }
.copy-msg { font-size: 12px; color: #22c55e; margin-top: 4px; display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>free<span>IA</span></h1>
    <p>Clone de voz e foto com transcrição em tempo real</p>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-photo"></i> Sua foto</div>
    <div class="photo-area" id="photoArea" onclick="document.getElementById('fileInput').click()">
      <div class="photo-placeholder" id="photoPlaceholder">
        <i class="ti ti-camera-plus"></i>
        <span>Toque para escolher da galeria</span>
      </div>
      <img id="photoPreview" class="hidden" alt="Foto do usuário" />
    </div>
    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handlePhoto(event)" />
    <div class="photo-btn-row" id="photoBtnRow" style="display:none">
      <button onclick="document.getElementById('fileInput').click()"><i class="ti ti-replace"></i> Trocar foto</button>
      <button class="danger" onclick="removePhoto()"><i class="ti ti-trash"></i> Remover</button>
    </div>
    <div class="avatar-preview" id="avatarPreview" style="display:none">
      <div class="avatar-circle"><img id="avatarImg" alt="Avatar" /></div>
      <div class="avatar-info">
        <div class="name" id="avatarName">Usuário</div>
        <div class="sub">Foto clonada com sucesso</div>
        <span class="tag"><i class="ti ti-check" style="font-size:11px"></i> Perfil ativo</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-microphone"></i> Gravar voz</div>
    <div class="waveform" id="waveform">
      <div class="bar" id="b1" style="height:8px"></div>
      <div class="bar" id="b2" style="height:14px"></div>
      <div class="bar" id="b3" style="height:6px"></div>
      <div class="bar" id="b4" style="height:20px"></div>
      <div class="bar" id="b5" style="height:10px"></div>
      <div class="bar" id="b6" style="height:16px"></div>
      <div class="bar" id="b7" style="height:8px"></div>
      <div class="bar" id="b8" style="height:18px"></div>
      <div class="bar" id="b9" style="height:6px"></div>
      <div class="bar" id="b10" style="height:12px"></div>
    </div>
    <button class="record-btn" id="recordBtn" onclick="toggleRecord()">
      <i class="ti ti-microphone" id="recordIcon"></i>
      <span id="recordLabel">Começar a gravar</span>
    </button>
    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Pronto para gravar</span>
      <span class="timer" id="timer"></span>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-file-text"></i> Transcrição</div>
    <div class="transcript-box" id="transcriptBox">
      <span class="transcript-placeholder" id="transcriptPlaceholder">O texto transcrito aparecerá aqui após a gravação...</span>
      <span id="transcriptText" class="hidden"></span>
      <span id="transcriptCursor" class="transcript-cursor hidden"></span>
      <button class="copy-btn hidden" id="copyBtn" onclick="copyTranscript()" title="Copiar texto"><i class="ti ti-copy"></i></button>
    </div>
    <div class="copy-msg" id="copyMsg"><i class="ti ti-check"></i> Copiado!</div>
  </div>
</div>

<script>
let isRecording = false;
let mediaRecorder = null;
let recognition = null;
let timerInterval = null;
let seconds = 0;
let waveInterval = null;

function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const preview = document.getElementById('photoPreview');
  preview.src = url;
  preview.classList.remove('hidden');
  document.getElementById('photoPlaceholder').style.display = 'none';
  document.getElementById('photoBtnRow').style.display = 'flex';
  document.getElementById('avatarImg').src = url;
  document.getElementById('avatarPreview').style.display = 'flex';
  const name = file.name.replace(/\.[^.]+
